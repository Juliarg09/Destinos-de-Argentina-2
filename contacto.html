<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top"><div class="container"><a class="navbar-brand fw-bold" href="index.html">🇦🇷 Explorá Argentina</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li><li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li><li class="nav-item"><a class="nav-link" href="destinos.html">Destinos</a></li><li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li><li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li></ul></div></div></nav>
<header class="page-hero"><div class="container"><p class="eyebrow">Estamos para ayudarte</p><h1>Contacto</h1><p>Contanos qué destino te gustaría conocer.</p></div></header>
<main class="container section-space"><div class="row justify-content-center"><div class="col-lg-8"><form id="form-contacto" class="contact-form"><div class="mb-3"><label for="nombre" class="form-label">Nombre completo</label><input class="form-control" id="nombre" name="nombre" type="text" placeholder="Tu nombre" required></div><div class="mb-3"><label for="email" class="form-label">Correo electrónico</label><input class="form-control" id="email" name="email" type="email" placeholder="nombre@ejemplo.com" required></div><div class="mb-3"><label for="destino" class="form-label">¿Qué destino te interesa?</label><select class="form-select" id="destino" name="destino" required><option value="">Elegí una opción</option><option>Bariloche</option><option>Cataratas del Iguazú</option><option>Mar del Plata</option><option>Mendoza</option><option>Otro destino</option></select></div><div class="mb-3"><label for="mensaje" class="form-label">Mensaje</label><textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribí tu consulta..." required></textarea></div><button class="btn btn-primary btn-lg" type="submit">Enviar mensaje</button><p id="mensaje-formulario" class="mt-3" aria-live="polite"></p><p class="small text-secondary mt-3 mb-0">Este formulario es una demostración escolar: muestra una confirmación, pero no envía datos a un servidor.</p></form></div></div></main>
<footer class="footer"><div class="container">Julian Cariola 4TO "A"</div></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script>
</body></html>
